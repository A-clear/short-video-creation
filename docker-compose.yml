# ==============================================================================
# ショート動画作成ツール - スケーリング対応構成
# ==============================================================================
#
#   PostgreSQL (+ pgvector)  … 本体 DB 兼ベクトル DB
#   Redis                    … 共有状態ストア / WebSocket マネージャ
#   MinIO                    … 共有ファイルストレージ（S3 互換）
#   Open WebUI               … アプリ本体
#   Open Terminal            … AI がコマンドを実行する作業環境（PWA 内のターミナル / ファイルブラウザ）
#   Open WebUI Computer      … 実マシン相当のエージェントワークスペース（独立 PWA + gateway）
#                               ＋ Python / TypeScript 開発ツールチェーンと codex CLI
#                               （docker/computer/Dockerfile でビルド）
#
# 起動:
#   cp .env.example .env  で値を埋めてから
#   docker compose build open-webui-computer   ← 初回とツール更新時に必要
#   docker compose up -d
#
# 水平スケール:
#   docker compose up -d --scale open-webui=3
#   ⚠️ ただし ENABLE_DB_MIGRATIONS の扱いに注意（下記 open-webui サービスのコメント参照）
#
# ⚠️ 本ファイルは意図的に実行しません（リポジトリのルール）。
#    起動はユーザが明示的に行ってください。
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # ----------------------------------------------------------------------------
  # 本体 DB とベクトル DB を兼ねます。
  # 既定の ChromaDB は SQLite ベースで fork-safe ではないため、
  # 複数ワーカー / 複数レプリカ構成では必ず pgvector に切り替えてください。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: svc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openwebui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
      POSTGRES_DB: ${POSTGRES_DB:-openwebui}
      # 総接続数 = (DATABASE_POOL_SIZE + DATABASE_POOL_MAX_OVERFLOW) × レプリカ数
      # .env の既定値（15 + 20）でレプリカ 3 台なら 105。余裕を持たせています。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # pgvector 拡張の作成。PGVECTOR_CREATE_EXTENSION=false で運用する場合に必要。
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-openwebui} -d ${POSTGRES_DB:-openwebui}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [svc-net]

  # ----------------------------------------------------------------------------
  # Redis
  # ----------------------------------------------------------------------------
  # ⚠️ 複数レプリカ構成では必須です。
  #    Functions の __event_emitter__ / __event_call__ は Socket.IO でブラウザと
  #    通信しますが、WebSocket 接続を保持するのは 1 レプリカだけです。
  #    Redis を挟まないと、別レプリカで動いた Pipe の進捗表示や入力フォームが
  #    ユーザに届かず、__event_call__ は 300 秒でタイムアウトします。
  redis:
    image: redis:7-alpine
    container_name: svc-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxclients
      - "10000"
      - --appendonly
      - "yes"
      # Pub/Sub のバッファ上限。既定値だとイベント量が多いときに切断されます。
      - --client-output-buffer-limit
      - "pubsub 1073741824 268435456 180"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [svc-net]

  # ----------------------------------------------------------------------------
  # MinIO（S3 互換の共有ファイルストレージ）
  # ----------------------------------------------------------------------------
  # 複数レプリカでアップロードファイルを共有するために使います。
  # 制御対象はアップロードファイルのみで、DB とベクトル DB には影響しません。
  # （共有ファイルシステムを NFS/EFS でマウントできる環境なら MinIO は不要です）
  minio:
    image: minio/minio:latest
    container_name: svc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER を .env に設定してください}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD を .env に設定してください}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [svc-net]

  # バケットを 1 回だけ作って終了する初期化ジョブ
  minio-init:
    image: minio/mc:latest
    container_name: svc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-open-webui}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/$${S3_BUCKET_NAME} &&
      echo 'bucket ready: '$${S3_BUCKET_NAME}
      "
    restart: "no"
    networks: [svc-net]

  # ----------------------------------------------------------------------------
  # Open Terminal（AI の実行環境）
  # ----------------------------------------------------------------------------
  # Open WebUI 本体に足りない「実際に手を動かす場所」を提供するコンポーネントです。
  # 接続するとチャットのサイドバーにファイルブラウザとターミナルが現れ、
  # モデルがコマンド実行・ファイル読み書きをツールとして呼べるようになります。
  #
  # ⚠️ Functions（Actions / Pipes / Filters）とは別レイヤです。
  #    動画編集そのものを Descript に委譲する方針は変わりません。
  #    ここは FCPXML の検査、ffprobe での尺・コーデック確認、中間ファイルの
  #    加工といった「手元でファイルを触る」作業のための実行環境です。
  #
  # ⚠️ ホストにポートを公開していません。
  #    ブラウザからのアクセスは常に Open WebUI のバックエンド経由
  #    （/api/v1/terminals/{server_id}/...）でプロキシされるため、
  #    API キーがブラウザに渡りません。これが admin 接続を使う理由です。
  open-terminal:
    # latest は約 4GB。Node.js / Python / コンパイラ / ffmpeg / Docker CLI 入りで、
    # sudo による追加インストールとマルチユーザにも対応します。
    # :slim（約 430MB）/ :alpine（約 230MB）は git・curl・jq のみで、
    # ffmpeg も sudo も入りません。本プロジェクトの用途では latest を選びます。
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: svc-open-terminal
    restart: unless-stopped
    environment:
      # 認証キー。v0.11.30 以降は未設定だと起動を拒否します。
      # ⚠️ 下の open-webui 側 TERMINAL_SERVER_CONNECTIONS の "key" と
      #    必ず同じ値になるようにしてください（どちらも同じ .env 変数を参照）。
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?OPEN_TERMINAL_API_KEY を .env に設定してください}

      # 既定値の * は全オリジン許可で、起動時に警告が出ます。
      # 実際の通信は Open WebUI のバックエンド経由なので、公開 URL だけで足ります。
      OPEN_TERMINAL_CORS_ALLOWED_ORIGINS: ${WEBUI_URL:-http://localhost:8080}

      # 同時ターミナルセッション数の上限（既定 16）。
      OPEN_TERMINAL_MAX_SESSIONS: ${OPEN_TERMINAL_MAX_SESSIONS:-16}

      # コマンド出力を待つ秒数。既定は「未設定 = 無期限に待つ」なので必ず入れます。
      # ffmpeg のエンコードが走る想定で長めにしています。
      OPEN_TERMINAL_EXECUTE_TIMEOUT: ${OPEN_TERMINAL_EXECUTE_TIMEOUT:-600}

      # 「この環境に何が入っているか」をモデルに伝える説明文。
      # ツールの description に載るので、責務の線引きもここで示しておきます。
      OPEN_TERMINAL_EXECUTE_DESCRIPTION: >-
        ショート動画作成ツールの作業用ターミナルです。ffmpeg / ffprobe / Python /
        Node.js / git が利用できます。FCPXML の検査、動画の尺・コーデック確認、
        中間ファイルの加工に使ってください。実際の動画編集は Descript 側が
        担当するため、ここで編集そのものを行わないでください。

      # ファイルブラウザのルート。home = /home/user（既定）。
      # 明示パス（/workspace 等）や filesystem（ルート全体）も指定できますが、
      # filesystem はコンテナ全体が見えるようになるため使いません。
      OPEN_TERMINAL_FILE_BROWSER_ROOT: home

      # 起動のたびに再インストールされる追加パッケージ（Docker イメージ限定）。
      # 数が増えるならカスタムイメージを作ってください。
      # OPEN_TERMINAL_PACKAGES: ""
      # OPEN_TERMINAL_PIP_PACKAGES: ""
      # OPEN_TERMINAL_NPM_PACKAGES: ""

      # egress ファイアウォール。設定するとここに挙げたドメイン以外へ出られません。
      # パッケージ導入だけ許して情報の持ち出しを塞ぎたい場合に有効です。
      # OPEN_TERMINAL_ALLOWED_DOMAINS: "pypi.org,files.pythonhosted.org,github.com,*.npmjs.org"
    volumes:
      # 作業ファイルの永続化。このボリュームを消すと AI の作業結果も消えます。
      - open-terminal-data:/home/user
    # 暴走したスクリプトがホストを食い潰さないための上限。
    # 超過すると CPU はスロットル、メモリは OOM kill されます。
    deploy:
      resources:
        limits:
          memory: ${OPEN_TERMINAL_MEMORY_LIMIT:-2G}
          cpus: "${OPEN_TERMINAL_CPU_LIMIT:-2.0}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    #
    # 検証時に直接叩きたい場合のみ有効化してください（http://localhost:8000/docs）。
    # 常用すると API キーを知っている誰でもコマンドを実行できる口になります。
    # ports:
    #   - "${OPEN_TERMINAL_PORT:-8000}:8000"
    #
    # ⚠️ svc-net には載せません。載せると、このコンテナから postgres / redis /
    #    minio にホスト名で直接到達できてしまいます。open-webui とだけ
    #    通じる専用ネットワークに閉じ込めます。
    networks: [svc-terminal-net]

  # ----------------------------------------------------------------------------
  # Open WebUI Computer（cptr）
  # ----------------------------------------------------------------------------
  # 「実マシンをブラウザに出す」コンポーネントです。ファイル・エディタ・ターミナル・
  # git に加えて、独自のエージェントランタイム（承認モード / サブエージェント /
  # スキル / スケジュール実行）を持ちます。
  #
  # ⚠️ Open Terminal とは別物です。役割の線引き:
  #    - Open Terminal … Open WebUI の中の「手」。バックエンドがプロキシする部品で、
  #                      チャットのサイドバーに出る。使い捨ての作業環境。
  #    - Computer      … 独立した 1 つのアプリ。自前のログイン・自前の PWA を持ち、
  #                      作業が継続する常設ワークスペース。Open WebUI からは
  #                      gateway 経由で `cptr/<workspace>` というモデルとして見える。
  #
  # ⚠️ Open Terminal と違い、ホストへのポート公開が必須です。
  #    Computer は Open WebUI のバックエンドを経由せず、ブラウザが直接 Socket.IO で
  #    つなぎに行くためです。「隠す」ことはできないので、代わりに
  #    ①ネットワークをデータ層から切り離す ②公開先を絞る、で守ります。
  #
  # ⚠️ セキュリティモデルは「サインインしたユーザ = SSH 相当の全権」。
  #    ユーザ間の分離はありません。境界はマウントしたディレクトリだけです。
  #    生の公開インターネットには出さないでください（Tailscale / 認証付き
  #    リバースプロキシの内側に置く）。
  open-webui-computer:
    # ⚠️ このサービスだけ公式イメージをそのまま使わず、ビルドします。
    #    公式イメージ（:latest が安定版、:dev が main 追従）は意図的に最小構成で、
    #    node も npm も curl も gcc も入っていません。エージェントに Python /
    #    TypeScript の開発をさせる面なので、docker/computer/Dockerfile で
    #    開発ツールチェーンと codex CLI を足しています。
    #
    #    apt パッケージは実行中のコンテナには足せません（cptr は非 root で
    #    sudo も無い）。だから起動時インストールではなくビルドになります。
    #
    #    ⚠️ 変更を反映するには明示的なビルドが要ります:
    #         docker compose build open-webui-computer
    #       `docker compose up -d` だけでは既存イメージが再利用されます。
    build:
      context: ./docker/computer
      args:
        COMPUTER_IMAGE: ${OPEN_WEBUI_COMPUTER_IMAGE:-ghcr.io/open-webui/computer:latest}
        NODE_VERSION: ${NODE_VERSION:-22}
        PNPM_VERSION: ${PNPM_VERSION:-11.24.0}
        TYPESCRIPT_VERSION: ${TYPESCRIPT_VERSION:-7.0.2}
        TSX_VERSION: ${TSX_VERSION:-4.23.12}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-rust-v0.149.1}
        CODEX_CLI_TARGET: ${CODEX_CLI_TARGET:-x86_64-unknown-linux-musl}
    # ビルド結果に付ける名前。docker images で見分けるためだけのものです。
    image: svc/open-webui-computer:local
    container_name: svc-open-webui-computer
    restart: unless-stopped
    environment:
      # イメージ側で既に /data に設定済みですが、下の volume と対応させるため明示します。
      # DB（SQLite）・config.toml・アップロード・ログが全部ここに入ります。
      CPTR_DATA_DIR: /data

      CPTR_LOG_LEVEL: ${OPEN_WEBUI_COMPUTER_LOG_LEVEL:-INFO}
      # 収集基盤に流す前提で JSON にしておきます（text も可）。
      CPTR_LOG_FORMAT: json

      # 既定は NONE（監査ログ無し）。SSH 相当の権限を持つ面なので METADATA 以上を推奨。
      # METADATA = 変更系リクエストの記録 / REQUEST = リクエストボディ（マスク済み）も記録。
      # ⚠️ 端末の全操作ログではありません。あくまで API レベルの記録です。
      CPTR_AUDIT_LOG_LEVEL: ${OPEN_WEBUI_COMPUTER_AUDIT_LOG_LEVEL:-METADATA}

      # 既定の * は全オリジン許可。Computer 自身の公開 URL と Open WebUI の URL に絞ります。
      # ⚠️ カンマ区切りです（Open Terminal はセミコロン区切りではない点も含めて別仕様）。
      CPTR_CORS_ALLOWED_ORIGINS: ${OPEN_WEBUI_COMPUTER_URL:-http://localhost:8001},${WEBUI_URL:-http://localhost:8080}

      # run_command が「返る」までの秒数。既定は未設定 = コマンドは走り続けたまま即返る。
      # ffmpeg のエンコードを待たせたいので明示します。
      CPTR_EXECUTE_TIMEOUT: ${OPEN_WEBUI_COMPUTER_EXECUTE_TIMEOUT:-600}

      # Web 検索。キー未設定だと DuckDuckGo にフォールバックします。
      # 優先順は Exa → Perplexity → Tavily → Brave → Firecrawl → SearXNG → DuckDuckGo。
      # EXA_API_KEY / PERPLEXITY_API_KEY を入れると Tavily より先に使われるので入れないこと。
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # ⚠️ LLM プロバイダ（OpenAI / Anthropic）は環境変数で設定できません。
      #    Computer 側の Settings → Admin → Connections で登録します。
      #    本プロジェクトの選定モデルは .env.example の「Open WebUI Computer」節を参照。
    volumes:
      # アプリ状態。named volume にしています。
      # ⚠️ ホストディレクトリを /data に bind mount すると、SQLite が app.db を
      #    作れずに起動失敗します（ホスト側の所有者がイメージの設定を上書きするため）。
      - open-webui-computer-data:/data
      # 作業領域。UI のワークスペースピッカーから追加するのはこのパスです。
      # ⚠️ /workspace はベースイメージに存在しないため、Dockerfile 側で
      #    cptr 所有として作っています。これが無いと Docker が root 所有で
      #    ディレクトリを作り、ピッカーからフォルダを作れなくなります
      #    （UI の操作もコンテナ内では cptr として実行されるため）。
      - open-webui-computer-workspace:/workspace
      #
      # codex のログイン情報（auth.json）。CODEX_HOME の既定値がそのまま
      # $HOME/.codex なので、環境変数を足さずにこのパスへ被せています。
      # ⚠️ ここを永続化しないと、コンテナを作り直すたびに再ログインになります。
      #    /data とは別ボリュームにして、cptr の設定と混ざらないようにしています。
      - codex-home:/home/cptr/.codex
      #
      # パッケージキャッシュ。$HOME はボリュームではないので、これが無いと
      # コンテナを作り直すたびに pnpm install / uv sync が全部落とし直しになります。
      #   .cache … uv / pip / npm
      #   .local … pnpm のストアとグローバル bin
      # ⚠️ 3 つとも Dockerfile 側で cptr 所有のディレクトリを作ってあります。
      #    イメージに無いパスへボリュームを張ると Docker が root 所有で作り、
      #    書き込めずに静かに壊れるためです。
      - open-webui-computer-cache:/home/cptr/.cache
      - open-webui-computer-local:/home/cptr/.local
      #
      # ホストの実プロジェクトを触らせたい場合はここに足します（マウントした分だけが境界）。
      # ⚠️ gateway 経由の実行は全ツール自動承認なので、書き込み可でマウントする範囲は
      #    「エージェントに勝手に触られてよい」ものだけにしてください。
      # - ./docs:/workspace/docs
      # - ./functions:/workspace/functions
    ports:
      # ⚠️ Open Terminal と違い、これはコメントアウトできません。
      #    ブラウザが直接この口に来ます。ホスト側の既定は 8001（8080=Open WebUI、
      #    8000=Open Terminal の検証用ポートと衝突させないため）。
      - "${OPEN_WEBUI_COMPUTER_PORT:-8001}:8000"
    deploy:
      resources:
        limits:
          memory: ${OPEN_WEBUI_COMPUTER_MEMORY_LIMIT:-4G}
          cpus: "${OPEN_WEBUI_COMPUTER_CPU_LIMIT:-4.0}"
    healthcheck:
      # curl の同梱は保証されていないため、確実に存在する python で叩きます。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # ⚠️ svc-net には載せません（postgres / redis / minio に到達させないため）。
    #    open-terminal とも別ネットワークにして、両者を相互に見えなくしています。
    networks: [svc-computer-net]

  # ----------------------------------------------------------------------------
  # Open WebUI
  # ----------------------------------------------------------------------------
  open-webui:
    # upstream との乖離を最小に保つ方針のため、既定では公式イメージを使います。
    # Functions はイメージに焼き込まず、管理画面の Import From Link で
    # GitHub の raw URL から取り込みます。
    image: ghcr.io/open-webui/open-webui:main
    #
    # submodule のフォークからビルドする場合は image をコメントアウトして
    # 以下を有効にしてください。
    # build:
    #   context: ./full-stack/open-webui
    #   dockerfile: Dockerfile
    #
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # ⚠️ service_healthy にしていません。
      #    open-terminal は約 4GB のイメージで初回 pull と起動に時間がかかります。
      #    ターミナルが落ちていてもチャット本体は使えるべきなので、
      #    起動を待たない service_started にしています。
      open-terminal:
        condition: service_started
      # 同じく service_started。起動時に Open WebUI は有効な OpenAI 互換接続の
      # /v1/models を引きに行くため、先に上がっていた方がログが汚れません。
      open-webui-computer:
        condition: service_started
    env_file:
      - .env
    environment:
      # .env の値をコンテナ間のホスト名で上書きします。
      DATABASE_URL: postgresql://${POSTGRES_USER:-openwebui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openwebui}
      PGVECTOR_DB_URL: postgresql://${POSTGRES_USER:-openwebui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openwebui}
      REDIS_URL: redis://redis:6379/0
      WEBSOCKET_REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      #
      # ⚠️ --scale open-webui=N で水平スケールする場合:
      #    マイグレーションを 1 台だけに任せる必要があります。
      #    compose の --scale では個別のレプリカに違う環境変数を渡せないため、
      #    以下のいずれかを選んでください。
      #      (a) 一度 1 台で起動してマイグレーションを完了させ、
      #          ENABLE_DB_MIGRATIONS=false にしてから --scale する
      #      (b) 別途 init コンテナ / ジョブでマイグレーションを実行する
      #    Kubernetes では initContainer か Job を使ってください。
      ENABLE_DB_MIGRATIONS: ${ENABLE_DB_MIGRATIONS:-true}
      #
      # Open Terminal の接続定義。管理画面（Admin Settings → Integrations →
      # Open Terminal）で手作業登録する代わりに、起動時に流し込みます。
      #
      # ⚠️ 見落とすと沈黙して壊れる 3 点（v0.11.0 の実ソースで確認）:
      #   ① config.py:386 の json.loads には try/except がありません。
      #      TOOL_SERVER_CONNECTIONS（config.py:372）は例外を握り潰しますが、
      #      こちらは JSON が壊れていると import 時に落ちて起動できません。
      #   ② PersistentConfig 相当です。DEFAULT_CONFIG（config.py:2800）経由で
      #      Config.seed_defaults() に渡されますが、この関数は
      #      「DB に無いキーだけ INSERT」します（models/config.py:256）。
      #      つまり取り込まれるのは初回起動時だけで、2 回目以降は
      #      Admin Settings の値が正になります。ここを変えて反映したい場合は
      #      管理画面で操作するか、DB の terminal_server.connections を消して再起動。
      #   ③ access_grants が空 / 未指定だと「管理者のみ」になります
      #      （utils/access_control/__init__.py:167）。公式ドキュメントの
      #      direct connection の例は [] なので、そのまま写すと一般ユーザに
      #      ターミナルが見えません。全員に開くには principal_id "*" の
      #      read grant が要ります（utils/access_control/__init__.py:140）。
      #      特定グループに絞る場合は
      #        {"principal_type": "group", "principal_id": "<group_id>", "permission": "read"}
      #
      # ⚠️ 折り畳みブロック（>-）の中は必ず同じインデントに揃えてください。
      #    深いインデントの行があると YAML が改行を保持してしまいます。
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id": "open-terminal", "name": "作業用ターミナル",
        "url": "http://open-terminal:8000", "key": "${OPEN_TERMINAL_API_KEY}",
        "auth_type": "bearer", "enabled": true,
        "config": {"access_grants":
        [{"principal_type": "user", "principal_id": "*", "permission": "read"}]}}]
      #
      # Open WebUI → Open WebUI Computer の接続（OpenAI 互換 gateway）。
      # Computer の各ワークスペースが `cptr/<workspace>` としてモデルピッカーに出ます。
      #
      # 添字 0 = 本物の OpenAI（.env の OPENAI_API_BASE_URL / OPENAI_API_KEY をそのまま使用）
      # 添字 1 = Computer の gateway
      # OPENAI_API_CONFIGS のキーは「この配列の添字を文字列にしたもの」です
      #（routers/openai.py:544 の api_configs.get(str(idx), ...)）。
      #
      # ⚠️ 手順が前後すると反映されません。以下の順でしか初期投入できません:
      #   ① docker compose up -d open-webui-computer
      #   ② docker compose logs open-webui-computer で初回セットアップ URL
      #      （/?token=...）を拾い、admin アカウントを作る
      #   ③ Computer の Settings → Admin → Gateway で API キーを発行
      #      （sk-cptr-... は 1 回しか表示されず、以降はハッシュ保存）
      #   ④ .env の OPEN_WEBUI_COMPUTER_GATEWAY_KEY に貼り、
      #      OPEN_WEBUI_COMPUTER_ENABLED=true にする
      #   ⑤ そのうえで Open WebUI を初回起動する
      #
      # ⚠️ ※PersistentConfig です。TERMINAL_SERVER_CONNECTIONS と同じで
      #    seed_defaults() は「DB に無いキーだけ INSERT」します
      #    （models/config.py:256）。既に一度起動した環境ではここを変えても
      #    無視されるので、Admin Settings → Connections で直してください。
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1};http://open-webui-computer:8000/v1
      OPENAI_API_KEYS: ${OPENAI_API_KEY};${OPEN_WEBUI_COMPUTER_GATEWAY_KEY:-}
      #
      # headers は接続ごとのカスタムヘッダで、値は utils/headers.py:114-131 の
      # プレースホルダに置換されます。この 5 つを渡すことで
      #   - 会話の継続（follow-up が Computer 側の同じチャットに入る）
      #   - 分岐の同期（Open WebUI での編集 / 再生成が Computer 側でも枝になる）
      #   - 裏方タスクの除外（タイトル / タグ / 追従候補の生成でエージェントを起動しない）
      # が効きます。1 つでも欠けると素のチャットしか成立しません。
      #
      # ⚠️ enable は true / false のみ（JSON の真偽値）。壊れた JSON は
      #    config.py:349 で警告のうえ握り潰され、接続が「無かったこと」になります。
      # ⚠️ gateway 経由の実行に個別承認はありません。Computer 側のエージェントが
      #    ファイル編集・コマンド実行・ツール呼び出しを全自動で行います。
      #
      # ⚠️ api_type は接続ごとの設定で、Computer の gateway では必ず
      #    Chat Completions（= "responses" 以外）にすること。
      #    gateway が実装しているのは GET /v1/models と
      #    POST /v1/chat/completions の 2 つだけで、Responses API は
      #    持っていません。"responses" にすると Open WebUI が
      #    POST /v1/responses を叩き、`Method Not Allowed`（405）になります
      #    （判定は routers/openai.py:1284 の
      #      `api_config.get('api_type') == 'responses'`）。
      #    添字 0（本物の OpenAI）は Responses API を使えるので、
      #    ここを揃える必要はありません。
      #
      # ⚠️ ※PC なので、既に起動済みの環境ではこの値を変えても効きません。
      #    Admin Settings → Connections で該当接続を開き、
      #    「API Type」を Chat Completions に切り替えてください。
      OPENAI_API_CONFIGS: >-
        {"0": {"enable": true},
        "1": {"enable": ${OPEN_WEBUI_COMPUTER_ENABLED:-false},
        "connection_type": "external",
        "api_type": "",
        "headers": {"X-OpenWebUI-Chat-Id": "{{CHAT_ID}}",
        "X-OpenWebUI-Message-Id": "{{MESSAGE_ID}}",
        "X-OpenWebUI-User-Message-Id": "{{USER_MESSAGE_ID}}",
        "X-OpenWebUI-User-Message-Parent-Id": "{{USER_MESSAGE_PARENT_ID}}",
        "X-OpenWebUI-Task": "{{TASK}}"}}}
    ports:
      - "${OPEN_WEBUI_PORT:-8080}:8080"
    volumes:
      # STORAGE_PROVIDER=s3 でもローカルキャッシュや一時ファイルに使われます。
      - open-webui-data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # svc-terminal-net / svc-computer-net にも参加します。open-terminal と
    # open-webui-computer へ到達できるのはこのサービスだけで、両者は
    # svc-net に載っていないためデータ層にも互いにも到達できません。
    networks: [svc-net, svc-terminal-net, svc-computer-net]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  open-webui-data:
  open-terminal-data:
  open-webui-computer-data:
  open-webui-computer-workspace:
  # codex のログイン情報。⚠️ これを消すと再ログインが必要になります。
  codex-home:
  # パッケージキャッシュ。消しても再取得されるだけで、失うものはありません。
  open-webui-computer-cache:
  open-webui-computer-local:

networks:
  svc-net:
    driver: bridge

  # Open WebUI ↔ Open Terminal 専用。データ層（postgres / redis / minio）を
  # ターミナルから見えなくするために分けています。
  svc-terminal-net:
    driver: bridge
    # ⚠️ internal: true にすると open-terminal は外部へ一切出られなくなります。
    #    最も安全ですが、pip install / npm install / git clone も不可になります。
    #    「多少は外に出したい」場合は internal は使わず、open-terminal 側の
    #    OPEN_TERMINAL_ALLOWED_DOMAINS でドメインを絞ってください。
    # internal: true

  # Open WebUI ↔ Open WebUI Computer 専用。
  # svc-terminal-net と分けているのは、open-terminal と open-webui-computer を
  # 相互に到達不能にするためです（どちらもコマンド実行ができる面なので、
  # 片方が落ちたときの横移動を塞ぎます）。
  #
  # ⚠️ internal: true にはできません。Computer は OpenAI / Anthropic API と
  #    Tavily に出る必要があり、また ports 公開でホストからも入ってきます。
  svc-computer-net:
    driver: bridge
