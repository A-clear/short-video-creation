name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # CodSpeed が初期データ生成のためにバックテストを起動できるようにする
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # CodSpeed の OpenID Connect 認証に必要

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # ベンチマークは functions/ と scripts/ のみを対象とするため
          # open-webui の submodule は取得しない
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest benchmarks/ --codspeed
